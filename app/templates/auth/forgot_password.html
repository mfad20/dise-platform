{% extends "base.html" %}
{% block title %}Mot de passe oublié — DISE{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:420px;">
    <div class="card">
      <h1 class="text-center">Mot de passe oublié</h1>
      <p class="text-muted" style="font-size:.88rem;">Indiquez l'e-mail ou le téléphone associé à votre compte. Un lien de réinitialisation valable 1 heure vous sera envoyé.</p>
      <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="identifiant">E-mail ou téléphone</label>
        <input type="text" id="identifiant" name="identifiant" required>
        <button type="submit" class="btn btn-primary btn-block">Envoyer le lien de réinitialisation</button>
      </form>
      <p class="text-center mt-2" style="font-size:.88rem;"><a href="{{ url_for('auth.login') }}">← Retour à la connexion</a></p>
    </div>
  </div>
</section>
{% endblock %}
