{% extends "base.html" %}
{% block title %}Nouveau mot de passe — DISE{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:420px;">
    <div class="card">
      <h1 class="text-center">Nouveau mot de passe</h1>
      <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" name="password" required minlength="8">
        <label for="password_confirm">Confirmer</label>
        <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
        <button type="submit" class="btn btn-primary btn-block">Réinitialiser le mot de passe</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
