services:
  - type: web
    name: dise-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
